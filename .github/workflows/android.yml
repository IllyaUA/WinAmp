name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: winamp-classic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Every push to main refreshes the "latest" release, which gives a stable public download link.
      - name: Rename APK
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk WinAmp-Classic.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WinAmp Classic (latest build from main)
          body: |
            Debug-signed APK built from the latest commit on main (${{ github.sha }}).
            Install: download WinAmp-Classic.apk on your phone, open it, and allow installs from your browser or file manager when Android asks.
          files: WinAmp-Classic.apk
          prerelease: false
          make_latest: true
