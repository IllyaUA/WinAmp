name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WinAmp-Classic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: winamp-classic-android-apk
          path: WinAmp-Classic.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        shell: bash
        run: ./gradlew --no-daemon :desktop:test

      - name: Build jar
        shell: bash
        run: ./gradlew --no-daemon :desktop:shadowJar

      # jpackage bundles a Java runtime, so the download runs without Java installed.
      - name: Package app
        shell: bash
        run: |
          jpackage --type app-image --name WinAmpClassic \
            --input desktop/build/libs --main-jar winamp-classic.jar \
            --main-class com.illyaua.winamp.desktop.MainKt \
            --dest dist --app-version 1.0 \
            --add-modules java.base,java.desktop,java.logging,java.prefs,java.naming,jdk.unsupported \
            --java-options "-Xmx512m"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf WinAmpClassic-${{ matrix.name }}.tar.gz WinAmpClassic

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/WinAmpClassic -DestinationPath WinAmpClassic-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: winamp-classic-desktop-${{ matrix.name }}
          path: |
            WinAmpClassic-${{ matrix.name }}.tar.gz
            WinAmpClassic-${{ matrix.name }}.zip

      - name: Keep the runnable jar
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: winamp-classic-desktop-jar
          path: desktop/build/libs/winamp-classic.jar

      - name: Test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report-${{ matrix.name }}
          path: desktop/build/reports/tests

  # Every push to main refreshes the "latest" release, which gives stable public download links.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WinAmp Classic (latest build from main)
          body: |
            Built from the latest commit on main (${{ github.sha }}).

            **Android**: `WinAmp-Classic.apk` (debug-signed; allow installs from your browser or file manager).
            **Windows**: `WinAmpClassic-windows-x64.zip`, unzip and run `WinAmpClassic.exe`. No Java needed.
            **Linux**: `WinAmpClassic-linux-x64.tar.gz`, extract and run `WinAmpClassic/bin/WinAmpClassic`. No Java needed.
            **Any system with Java 17+**: `winamp-classic.jar`, run with `java -jar winamp-classic.jar`.
          files: |
            artifacts/WinAmp-Classic.apk
            artifacts/WinAmpClassic-windows-x64.zip
            artifacts/WinAmpClassic-linux-x64.tar.gz
            artifacts/winamp-classic.jar
          prerelease: false
          make_latest: true
